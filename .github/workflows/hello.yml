name: DevOps Workflow

on: push

jobs:
  practice:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome message
        run: echo "Starting DevOps practice"

      - name: Show current date
        run: date

      - name: Show Linux information
        run: uname -a

      - name: Finish message
        run: echo "Workflow completed successfully"
